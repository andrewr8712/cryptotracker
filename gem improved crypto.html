<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Market Monitor | Real-Time Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-tertiary: #1a2332;
            --border-color: #2d3748;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #eab308;
            --glow-green: rgba(34, 197, 94, 0.3);
            --glow-red: rgba(239, 68, 68, 0.3);
        }
        
        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }
        
        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Top Bar */
        .top-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 20px;
            color: var(--bg-primary);
        }
        
        .logo-text {
            display: flex;
            flex-direction: column;
        }
        
        .logo-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .logo-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-indicators {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: relative;
        }
        
        .status-dot.connected {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--glow-green);
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        .status-dot.connecting {
            background: var(--accent-yellow);
            animation: blink 1s ease-in-out infinite;
        }
        
        .status-dot.disconnected {
            background: var(--accent-red);
            box-shadow: 0 0 5px var(--glow-red);
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px var(--glow-green); }
            50% { box-shadow: 0 0 20px var(--glow-green); }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .status-text { color: var(--text-secondary); }
        .status-value { color: var(--text-primary); font-weight: 600; }
        
        /* Grid Layout */
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        /* Crypto Card */
        .crypto-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .crypto-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .crypto-card.price-update::before {
            opacity: 1;
            animation: scan 1s ease-out;
        }
        
        @keyframes scan {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }
        
        .crypto-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }
        
        /* Card Header */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .crypto-identity {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .crypto-icon {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
        }
        
        .crypto-info {
            display: flex;
            flex-direction: column;
        }
        
        .crypto-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-green);
        }
        
        .live-dot {
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .crypto-symbol {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .change-badge {
            padding: 6px 10px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .change-badge.positive {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .change-badge.negative {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        /* Price Display */
        .price-section { margin-bottom: 16px; }
        
        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .price-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
        }
        
        .price-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .price-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        
        .price-value.flash-up {
            color: var(--accent-green);
            text-shadow: 0 0 10px var(--glow-green);
        }
        
        .price-value.flash-down {
            color: var(--accent-red);
            text-shadow: 0 0 10px var(--glow-red);
        }
        
        /* Chart Section */
        .chart-section { margin-bottom: 16px; }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .chart-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .chart-period {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid var(--border-color);
        }
        
        .chart-container {
            height: 120px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .stat-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
        }
        
        .stat-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .stat-value.positive { color: var(--accent-green); }
        .stat-value.negative { color: var(--accent-red); }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        /* Footer Info */
        .info-footer {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .info-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .info-highlight {
            color: var(--accent-blue);
            font-weight: 600;
        }
        
        .tech-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .tech-icon {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .crypto-grid {
                grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            .crypto-grid { grid-template-columns: 1fr; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .status-indicators { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="logo-section">
                <div class="logo">Ƈ</div>
                <div class="logo-text">
                    <div class="logo-title">Crypto Market Monitor</div>
                    <div class="logo-subtitle">Real-Time Analytics Dashboard</div>
                </div>
            </div>
            <div class="status-indicators">
                <div class="status-item">
                    <span class="status-dot connecting" id="statusDot"></span>
                    <span class="status-text">Socket:</span>
                    <span class="status-value" id="statusText">Initializing</span>
                </div>
                <div class="status-item">
                    <span class="status-text">Ping:</span>
                    <span class="status-value" id="latencyVal">-- ms</span>
                </div>
                <div class="status-item">
                    <span class="status-text">Events/min:</span>
                    <span class="status-value" id="updateCount">0</span>
                </div>
            </div>
        </div>
        
        <div id="cryptoContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Establishing Multiplexed WebSocket...</div>
                <div class="loading-text" style="margin-top: 8px; opacity: 0.6;">Connecting to Binance streams</div>
            </div>
        </div>
        
        <div class="info-footer">
            <div class="info-text">
                <span class="info-highlight">WebSocket Protocol</span> • Live data from Binance • Multiplexed Stream
            </div>
            <div style="display: flex; gap: 8px;">
                <div class="tech-badge">
                    <span class="tech-icon"></span>
                    Chart.js v4.4
                </div>
                <div class="tech-badge">
                    <span class="tech-icon"></span>
                    Optimized Rendering
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const cryptoConfig = [
            { id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin', binanceSymbol: 'btcusdt', icon: 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png' },
            { id: 'ethereum', symbol: 'ETH', name: 'Ethereum', binanceSymbol: 'ethusdt', icon: 'https://assets.coingecko.com/coins/images/279/large/ethereum.png' },
            { id: 'binancecoin', symbol: 'BNB', name: 'BNB', binanceSymbol: 'bnbusdt', icon: 'https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png' },
            { id: 'cardano', symbol: 'ADA', name: 'Cardano', binanceSymbol: 'adausdt', icon: 'https://assets.coingecko.com/coins/images/975/large/cardano.png' },
            { id: 'solana', symbol: 'SOL', name: 'Solana', binanceSymbol: 'solusdt', icon: 'https://assets.coingecko.com/coins/images/4128/large/solana.png' },
            { id: 'ripple', symbol: 'XRP', name: 'XRP', binanceSymbol: 'xrpusdt', icon: 'https://assets.coingecko.com/coins/images/44/large/xrp-symbol-white-128.png' },
            { id: 'polkadot', symbol: 'DOT', name: 'Polkadot', binanceSymbol: 'dotusdt', icon: 'https://assets.coingecko.com/coins/images/12171/large/polkadot.png' },
            { id: 'dogecoin', symbol: 'DOGE', name: 'Dogecoin', binanceSymbol: 'dogeusdt', icon: 'https://assets.coingecko.com/coins/images/5/large/dogecoin.png' }
        ];

        // --- STATE MANAGEMENT ---
        const state = {
            exchangeRate: 1.55, // Fallback default
            prices: {},         // Stores latest raw data
            history: {},        // Stores chart data
            charts: {},         // Chart instances
            socket: null,
            lastRender: 0,
            eventCounter: 0,
            updateStart: Date.now()
        };

        // Initialize State Arrays
        cryptoConfig.forEach(c => {
            state.prices[c.binanceSymbol] = { price: 0, prevPrice: 0, change: 0, volume: 0, lastUpdate: 0 };
            state.history[c.id] = [];
        });

        // --- UTILITIES ---
        const formatPrice = (price, currency = 'USD') => {
            const val = currency === 'AUD' ? price * state.exchangeRate : price;
            const opts = val >= 1 
                ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } 
                : { minimumFractionDigits: 4, maximumFractionDigits: 6 };
            return new Intl.NumberFormat('en-US', { style: 'currency', currency, ...opts }).format(val);
        };

        const formatLargeNumber = (num) => {
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(2) + 'M';
            return '$' + num.toLocaleString();
        };

        // --- DATA FETCHING ---
        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                state.exchangeRate = data.rates.AUD || 1.55;
            } catch (e) {
                console.warn('Exchange rate fetch failed, using default:', state.exchangeRate);
            }
        }

        // --- WEBSOCKET CONNECTION (MULTIPLEXED) ---
        function connectWebSocket() {
            // Combine all streams into one URL
            const streams = cryptoConfig.map(c => `${c.binanceSymbol}@ticker`).join('/');
            const url = `wss://stream.binance.com:9443/stream?streams=${streams}`;
            
            state.socket = new WebSocket(url);

            state.socket.onopen = () => {
                document.getElementById('statusDot').className = 'status-dot connected';
                document.getElementById('statusText').textContent = 'Active';
                console.log('Multiplexed WebSocket Connected');
            };

            state.socket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                const data = message.data; // Unpack payload
                const symbol = data.s.toLowerCase(); // Symbol key

                if (state.prices[symbol]) {
                    // Update State Logic
                    const prev = state.prices[symbol].price;
                    state.prices[symbol].prevPrice = prev;
                    state.prices[symbol].price = parseFloat(data.c);
                    state.prices[symbol].change = parseFloat(data.P);
                    state.prices[symbol].volume = parseFloat(data.q);
                    state.prices[symbol].lastUpdate = Date.now();
                    
                    state.eventCounter++;
                    
                    // Simple latency calc (Event time vs Local time)
                    const latency = Date.now() - data.E;
                    document.getElementById('latencyVal').textContent = `${latency > 0 ? latency : '<1'} ms`;
                }
            };

            state.socket.onclose = () => {
                document.getElementById('statusDot').className = 'status-dot disconnected';
                document.getElementById('statusText').textContent = 'Reconnecting';
                setTimeout(connectWebSocket, 5000);
            };

            state.socket.onerror = (err) => console.error("Socket Error:", err);
        }

        // --- CHART MANAGEMENT ---
        function initCharts() {
            cryptoConfig.forEach(crypto => {
                const ctx = document.getElementById(`chart-${crypto.id}`)?.getContext('2d');
                if (!ctx) return;

                state.charts[crypto.id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array(30).fill(''), // Fixed buffer size
                        datasets: [{
                            data: Array(30).fill(null),
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false, // Performance boost
                        plugins: { legend: { display: false }, tooltip: { enabled: false } },
                        scales: { x: { display: false }, y: { display: false } }
                    }
                });
            });
        }

        function updateCharts() {
            // Only update charts once every 2 seconds to save CPU
            const now = Date.now();
            if (now % 2000 > 100) return; 

            cryptoConfig.forEach(crypto => {
                const data = state.prices[crypto.binanceSymbol];
                if (!data || data.price === 0) return;

                const chart = state.charts[crypto.id];
                const chartData = chart.data.datasets[0].data;

                // Shift and push logic
                chartData.shift();
                chartData.push(data.price);
                
                // Color logic based on start vs end of window
                const first = chartData.find(v => v !== null) || data.price;
                const isPositive = data.price >= first;
                
                const color = isPositive ? '#22c55e' : '#ef4444';
                const bg = isPositive ? 'rgba(34, 197, 94, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                
                chart.data.datasets[0].borderColor = color;
                chart.data.datasets[0].backgroundColor = bg;
                chart.update('none'); // Update without animation
            });
        }

        // --- DOM GENERATION ---
        function createCards() {
            const container = document.getElementById('cryptoContainer');
            container.innerHTML = `<div class="crypto-grid">${cryptoConfig.map(crypto => `
                <div class="crypto-card" id="card-${crypto.id}">
                    <div class="card-header">
                        <div class="crypto-identity">
                            <img src="${crypto.icon}" alt="${crypto.name}" class="crypto-icon">
                            <div class="crypto-info">
                                <div class="crypto-name">
                                    ${crypto.name}
                                    <span class="live-indicator"><span class="live-dot"></span>Live</span>
                                </div>
                                <div class="crypto-symbol">${crypto.symbol}/USD</div>
                            </div>
                        </div>
                        <div class="change-badge" id="badge-${crypto.id}">--%</div>
                    </div>
                    <div class="price-section">
                        <div class="price-grid">
                            <div class="price-item">
                                <div class="price-label">USD Price</div>
                                <div class="price-value" id="price-usd-${crypto.id}">--</div>
                            </div>
                            <div class="price-item">
                                <div class="price-label">AUD Price</div>
                                <div class="price-value" id="price-aud-${crypto.id}">--</div>
                            </div>
                        </div>
                    </div>
                    <div class="chart-section">
                        <div class="chart-header">
                            <div class="chart-title">Trend (Approx)</div>
                            <div class="chart-period">Live</div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-${crypto.id}"></canvas>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">24h Change</div>
                            <div class="stat-value" id="change-${crypto.id}">--%</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">24h Volume</div>
                            <div class="stat-value" id="volume-${crypto.id}">--</div>
                        </div>
                    </div>
                </div>
            `).join('')}</div>`;
        }

        // --- RENDER LOOP (The Heartbeat) ---
        function renderLoop() {
            const now = Date.now();
            
            // Calculate Events Per Minute for UI
            if (now - state.updateStart > 5000) {
                const perMin = Math.round((state.eventCounter / (now - state.updateStart)) * 60000);
                document.getElementById('updateCount').textContent = perMin;
            }

            // Update DOM Elements
            cryptoConfig.forEach(crypto => {
                const data = state.prices[crypto.binanceSymbol];
                if (!data || data.price === 0) return; // Skip if no data yet

                // Elements
                const elUSD = document.getElementById(`price-usd-${crypto.id}`);
                const elAUD = document.getElementById(`price-aud-${crypto.id}`);
                const elBadge = document.getElementById(`badge-${crypto.id}`);
                const elChange = document.getElementById(`change-${crypto.id}`);
                const elVol = document.getElementById(`volume-${crypto.id}`);
                const card = document.getElementById(`card-${crypto.id}`);

                // Update Text (Efficiently)
                if (elUSD.textContent !== formatPrice(data.price, 'USD')) {
                    elUSD.textContent = formatPrice(data.price, 'USD');
                    elAUD.textContent = formatPrice(data.price, 'AUD');
                    
                    // Flash Logic
                    if (data.price > data.prevPrice) {
                        elUSD.classList.add('flash-up');
                        setTimeout(() => elUSD.classList.remove('flash-up'), 500);
                    } else if (data.price < data.prevPrice) {
                        elUSD.classList.add('flash-down');
                        setTimeout(() => elUSD.classList.remove('flash-down'), 500);
                    }
                }

                // Update Stats
                const changeSign = data.change >= 0 ? '+' : '';
                const changeTxt = `${changeSign}${data.change.toFixed(2)}%`;
                const cls = data.change >= 0 ? 'positive' : 'negative';

                if (elBadge.textContent !== changeTxt) {
                    elBadge.textContent = changeTxt;
                    elBadge.className = `change-badge ${cls}`;
                    elChange.textContent = changeTxt;
                    elChange.className = `stat-value ${cls}`;
                }
                
                elVol.textContent = formatLargeNumber(data.volume);
            });

            updateCharts();
            requestAnimationFrame(renderLoop);
        }

        // --- INITIALIZATION ---
        async function init() {
            await fetchExchangeRate();
            createCards();
            setTimeout(initCharts, 100); // Give DOM time to paint
            connectWebSocket();
            renderLoop();
        }

        init();
        
        window.addEventListener('beforeunload', () => {
            if (state.socket) state.socket.close();
        });
    </script>
</body>
</html>
